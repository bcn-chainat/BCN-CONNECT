<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCN Approval System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;700;900&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        
        #detail-modal { opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 100; }
        #detail-modal.active { opacity: 1; pointer-events: auto; }
        #modal-content { transform: translateY(50px); transition: all 0.3s ease; }
        #detail-modal.active #modal-content { transform: translateY(0); }

        .fc { --fc-button-bg-color: #1e293b; --fc-button-border-color: #1e293b; --fc-primary-text-color: #1e293b; font-size: 0.85rem; }
        .fc .fc-toolbar-title { font-weight: 900; text-transform: uppercase; font-size: 1.1rem; color: #1e293b; }
        .fc-event { cursor: pointer; border: none !important; padding: 4px 6px; border-radius: 8px; margin-bottom: 2px; }
        .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
.detail-value { font-size: 13px; text-align: right; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div id="admin-container" class="max-w-6xl mx-auto p-4 md:p-8 hidden">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center my-6 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-800 uppercase tracking-tight">ระบบอนุมัติการขอใช้ห้อง</h1>
                <p id="admin-email-display" class="text-[10px] font-bold text-slate-400 mb-3"></p>
                
                <div class="flex gap-6 border-b border-slate-200">
                    <button onclick="switchTab('list')" id="tab-list" class="text-xs font-black border-b-2 border-blue-600 text-blue-600 pb-2 transition-all">รายการรออนุมัติ</button>
                    <button onclick="switchTab('calendar')" id="tab-calendar" class="text-xs font-black text-slate-400 hover:text-slate-600 pb-2 transition-all">รูปแบบปฏิทิน</button>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100">
                    <span class="text-xs font-black text-slate-400 mr-3">รออนุมัติ</span>
                    <span id="pending-badge" class="bg-rose-500 text-white text-sm px-3 py-1 rounded-xl font-black shadow-lg shadow-rose-200">0</span>
                </div>
            </div>
        </header>

        <div id="approval-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center text-slate-400 italic">กำลังเชื่อมต่อข้อมูล...</div>
        </div>

        <div id="calendar-section" class="hidden bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
            <div id="calendar"></div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-[32px] overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-black text-slate-800 uppercase text-sm tracking-wider">รายละเอียดการจอง</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white shadow-sm text-slate-400 hover:text-rose-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 max-h-[70vh] overflow-y-auto text-slate-600"></div>
        </div>
    </div>

    <div id="access-denied" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <i class="fas fa-lock text-rose-500 text-3xl mb-4"></i>
        <h2 class="text-lg font-black text-slate-800">Access Denied</h2>
        <a href="booking.html" class="mt-6 text-blue-600 text-xs font-bold underline">กลับหน้าจองห้อง</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCGlTqnnQXqtP28OmPEK6G7yAYzip_YUgw",
  authDomain: "bcn-connect-by-bcnchainat.firebaseapp.com",
  projectId: "bcn-connect-by-bcnchainat",
  storageBucket: "bcn-connect-by-bcnchainat.firebasestorage.app",
  messagingSenderId: "399242462531",
  appId: "1:399242462531:web:a004ef638fa46865301bf6",
  measurementId: "G-5CBNDYJ1NP"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'bcn-connect-app';

        let calendar;
        let roomNamesCache = {}; // เก็บชื่อห้องจาก rid
        let allInventory = {};
        let allSupplies = {};

        onAuthStateChanged(auth, async (user) => {
            if (user && user.email) {
                await checkPermission(user.email);
            } else {
                window.location.href = "booking.html";
            }
        });

        async function checkPermission(email) {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'rooms_map'));
            if (snap.exists()) {
                const data = snap.data();
                const managers = data.managers || [];
                // สร้าง Cache ชื่อห้อง (ดึงจาก data.rooms.{id}.n)
                if (data.rooms) {
                    Object.entries(data.rooms).forEach(([rid, info]) => {
                        roomNamesCache[rid] = info.n || rid;
                    });
                }

                if (managers.includes(email)) {
                    document.getElementById('admin-container').classList.remove('hidden');
                    document.getElementById('admin-email-display').innerText = `Logged in as: ${email}`; 
                    await loadReferenceData();
                    listenToPending();
                } else {
                    document.getElementById('access-denied').classList.remove('hidden');
                }
            }
        }

        async function loadReferenceData() {
            const [invSnap, supSnap] = await Promise.all([
                getDoc(doc(db, 'artifacts', appId, 'public_data', 'inventory_system', 'main', 'inventory_map')),
                getDoc(doc(db, 'artifacts', appId, 'public_data', 'supplies_system', 'main', 'supplies_map'))
            ]);
            allInventory = invSnap.exists() ? (invSnap.data().items || {}) : {};
            allSupplies = supSnap.exists() ? (supSnap.data().items || {}) : {};
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                locale: 'th',
                eventClick: (info) => viewDetail(info.event.id)
            });
            calendar.render();
        }

        window.switchTab = (tab) => {
            const list = document.getElementById('approval-list');
            const cal = document.getElementById('calendar-section');
            const tList = document.getElementById('tab-list');
            const tCal = document.getElementById('tab-calendar');
            if (tab === 'list') {
                list.classList.remove('hidden'); cal.classList.add('hidden');
                tList.className = "text-xs font-black border-b-2 border-blue-600 text-blue-600 pb-2";
                tCal.className = "text-xs font-black text-slate-400 hover:text-slate-600 pb-2";
            } else {
                list.classList.add('hidden'); cal.classList.remove('hidden');
                tList.className = "text-xs font-black text-slate-400 hover:text-slate-600 pb-2";
                tCal.className = "text-xs font-black border-b-2 border-blue-600 text-blue-600 pb-2";
                if(calendar) setTimeout(() => calendar.render(), 100);
            }
        };

        function listenToPending() {
            initCalendar();
            onSnapshot(doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'booking_map'), (snap) => {
                if (!snap.exists()) return;
                const bookings = snap.data();
                
                // 1. จัดการรายการในหน้า List (แสดงเฉพาะ pending)
                const pendingIds = Object.entries(bookings)
                    .filter(([_, b]) => b.s === 'pending')
                    .map(([id, _]) => id);

                document.getElementById('pending-badge').innerText = pendingIds.length;
                renderList(pendingIds);

                // 2. จัดการรายการใน Calendar (กรองเอา rejected/cancelled ออก)
                const events = Object.entries(bookings)
                    .filter(([_, b]) => b.s === 'approved' || b.s === 'pending') // <-- เพิ่ม Filter ตรงนี้
                    .map(([id, b]) => {
                        const times = b.t ? b.t.split('-') : ["08:00", "17:00"];
                        const roomName = roomNamesCache[b.rid] || b.rid || 'Unknown Room';
                        
                        return {
                            id: id,
                            title: roomName,
                            start: `${b.d}T${times[0].trim()}:00`,
                            end: `${b.d}T${(times[1] || '17:00').trim()}:00`,
                            // ปรับสี: approved = เขียว, pending = แดงชมพู
                            backgroundColor: b.s === 'approved' ? '#10b981' : '#f43f5e',
                            borderColor: 'transparent'
                        };
                    });

                calendar.removeAllEvents();
                calendar.addEventSource(events);
            });
        }

        async function renderList(ids) {
            const list = document.getElementById('approval-list');
            if (ids.length === 0) {
                list.innerHTML = `<div class="col-span-full py-20 text-center text-slate-300 font-bold">ไม่มีรายการค้างอนุมัติ</div>`;
                return;
            }

            const itemsHtml = await Promise.all(ids.map(async (bid) => {
                const det = await getDoc(doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'bookings_detail', 'all_bookings', bid));
                const d = det.data();
                if(!d) return '';

                return `
                    <div class="bg-white border-2 border-slate-100 rounded-3xl p-5 card-shadow cursor-pointer hover:border-blue-200 transition-all" onclick="viewDetail('${bid}')">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-blue-50 text-blue-600 text-[9px] font-black px-2 py-1 rounded-lg uppercase">${d.roomName || roomNamesCache[d.rid] || 'ห้อง'}</span>
                            <span class="text-[9px] text-slate-300 font-mono">${bid}</span>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-sm font-black text-slate-700">${d.userName || 'ผู้จอง'}</h3>
                            <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">
                                <i class="far fa-calendar-alt mr-1"></i> ${d.date || d.d} | <i class="far fa-clock mr-1"></i> ${d.timeRange || d.t}
                            </p>
                        </div>
                        <div class="text-[11px] text-slate-600 bg-slate-50 p-3 rounded-2xl border border-slate-100 italic line-clamp-2 mb-5">"${d.purpose || '-'}"</div>
                        <div class="flex gap-2" onclick="event.stopPropagation()">
                            <button onclick="updateStatus('${bid}', 'rejected')" class="flex-1 py-3 text-xs font-black text-slate-400 hover:text-rose-500">ปฏิเสธ</button>
                            <button onclick="updateStatus('${bid}', 'approved')" class="flex-[2] py-3 bg-slate-800 text-white rounded-2xl text-xs font-black shadow-lg active:scale-95 transition-all">อนุมัติการใช้</button>
                        </div>
                    </div>
                `;
            }));
            list.innerHTML = itemsHtml.join('');
        }

        window.viewDetail = async (bid) => {
    const modal = document.getElementById('detail-modal');
    const body = document.getElementById('modal-body');
    modal.classList.add('active');
    body.innerHTML = `<div class="py-10 text-center"><i class="fas fa-circle-notch fa-spin text-blue-500 text-2xl"></i></div>`;

    try {
        const snap = await getDoc(doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'bookings_detail', 'all_bookings', bid));
        if (snap.exists()) {
            const d = snap.data();
            const rName = d.roomName || roomNamesCache[d.rid] || 'ไม่ระบุห้อง';

            // เตรียมข้อมูล ครุภัณฑ์
            const invHtml = (d.inventoryRequested || []).map(id => `
                <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-xl text-[10px] font-bold border border-blue-100">
                    <i class="fas fa-tag mr-1 opacity-50"></i>${allInventory[id]?.n || id}
                </span>
            `).join('') || '<span class="text-slate-300 text-[10px] italic font-medium">ไม่มีการขอใช้ครุภัณฑ์</span>';

            // เตรียมข้อมูล วัสดุสิ้นเปลือง
            const suppliesHtml = Object.entries(d.suppliesRequested || {}).map(([id, q]) => `
                <div class="flex justify-between items-center text-[11px] bg-amber-50/50 text-amber-800 p-2.5 rounded-xl border border-amber-100">
                    <span class="font-bold"><i class="fas fa-box-open mr-2 opacity-50"></i>${allSupplies[id]?.n || id}</span>
                    <span class="bg-amber-500 text-white px-2 py-0.5 rounded-lg font-black text-[10px]">x ${q}</span>
                </div>
            `).join('') || '<span class="text-slate-300 text-[10px] italic font-medium">ไม่มีการขอวัสดุสิ้นเปลือง</span>';

            // ส่วนแสดงผลข้อมูลหลัก
            let contentHtml = `
                <div class="bg-slate-50 rounded-[32px] p-5 shadow-inner border border-slate-100">
                    <div class="detail-row">
                        <span class="detail-label text-[10px]">สถานที่ / ห้อง</span>
                        <span class="detail-value text-blue-600 font-black text-sm">${rName}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">ผู้จอง</span>
                        <div class="text-right">
                            <div class="detail-value font-bold text-slate-700">${d.userName || 'ไม่ระบุชื่อ'}</div>
                            <div class="text-[9px] text-slate-500 font-medium">
                                ${d.userType || 'ทั่วไป'}${d.userType === 'นักศึกษา' ? ` (${d.curriculum || ''} รุ่น ${d.userBatch || ''})` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">เบอร์โทรติดต่อ</span>
                        <span class="detail-value text-blue-600 font-bold">
                            <a href="tel:${d.userPhone}" class="hover:underline">
                                <i class="fas fa-phone-alt mr-1"></i>${d.userPhone || '-'}
                            </a>
                        </span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">วันที่ใช้งาน</span>
                        <span class="detail-value font-bold text-slate-600">${d.date || d.d}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">ช่วงเวลา</span>
                        <span class="detail-value font-bold text-slate-600">${d.timeRange || d.t}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">จำนวนผู้เข้าร่วม</span>
                        <span class="detail-value text-blue-600 font-bold">${d.guests || '-'} คน</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label text-[10px]">รูปแบบการจัดห้อง</span>
                        <span class="detail-value text-indigo-600 font-bold">${d.roomLayout || 'สภาพปกติ'}</span>
                    </div>

                    <div class="mt-4 p-3.5 bg-white rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[9px] font-black text-slate-300 uppercase mb-1.5 tracking-widest">วัตถุประสงค์การใช้</p>
                        <p class="text-xs text-slate-600 leading-relaxed font-medium">${d.purpose || '-'}</p>
                    </div>
                </div>

                <div class="mt-6 px-1 space-y-5">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 tracking-wider">
                            <span class="w-5 h-5 bg-blue-100 text-blue-500 rounded-lg flex items-center justify-center text-[10px]"><i class="fas fa-tools"></i></span>
                            ครุภัณฑ์ที่ขอใช้เพิ่มเติม
                        </p>
                        <div class="flex flex-wrap gap-2">
                            ${invHtml}
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-3 flex items-center gap-2 tracking-wider">
                            <span class="w-5 h-5 bg-amber-100 text-amber-500 rounded-lg flex items-center justify-center text-[10px]"><i class="fas fa-hand-holding-heart"></i></span>
                            วัสดุ/อุปกรณ์สิ้นเปลือง
                        </p>
                        <div class="grid grid-cols-1 gap-2">
                            ${suppliesHtml}
                        </div>
                    </div>
                </div>
            `;

            // ส่วนจัดการปุ่ม (Action Buttons) เช็คสถานะ
            let actionButtons = '';
            if (d.status === 'pending') {
                actionButtons = `
                    <div class="mt-8 flex gap-3 pt-2">
                        <button onclick="updateStatus('${bid}', 'rejected')" class="flex-1 py-4 text-xs font-black text-slate-400 hover:text-rose-500 transition-colors uppercase tracking-widest">ปฏิเสธ</button>
                        <button onclick="updateStatus('${bid}', 'approved')" class="flex-[2] py-4 bg-slate-900 text-white rounded-2xl text-xs font-black shadow-xl shadow-slate-200 active:scale-95 transition-all uppercase tracking-widest">อนุมัติการใช้</button>
                    </div>
                `;
            } else {
                const isApp = d.status === 'approved';
                actionButtons = `
                    <div class="mt-8 p-4 ${isApp ? 'bg-emerald-500' : 'bg-rose-500'} text-white rounded-[24px] text-center shadow-lg shadow-slate-200">
                        <div class="text-[9px] font-black uppercase tracking-[3px] opacity-70 mb-1">Status</div>
                        <div class="text-xs font-bold uppercase"><i class="fas ${isApp ? 'fa-check-circle' : 'fa-times-circle'} mr-2"></i>${isApp ? 'Approved' : 'Rejected'}</div>
                        ${d.approvedAt ? `<div class="text-[8px] mt-2 opacity-60 font-medium">ดำเนินการเมื่อ: ${new Date(d.approvedAt).toLocaleString('th-TH')}</div>` : ''}
                    </div>
                `;
            }

            body.innerHTML = contentHtml + actionButtons;
        }
    } catch (e) {
        console.error("View Detail Error:", e);
        body.innerHTML = `<div class="py-10 text-center text-rose-500 text-xs font-bold">ไม่สามารถดึงข้อมูลได้: ${e.message}</div>`;
    }
};

        window.closeModal = () => document.getElementById('detail-modal').classList.remove('active');

        window.updateStatus = async (bid, status) => {
    if (!confirm(`ยืนยันการ ${status === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ'}?`)) return;

    try {
        const batch = writeBatch(db);
        const now = new Date().toISOString();
        
        const mapRef = doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'booking_map');
        const detailRef = doc(db, 'artifacts', appId, 'public_data', 'rooms_system', 'main', 'bookings_detail', 'all_bookings', bid);

        // 1. อัปเดตสถานะการจองห้อง
        batch.update(mapRef, { [`${bid}.s`]: status });
        batch.update(detailRef, { status: status, approvedAt: now });

        // 2. ถ้าอนุมัติ ให้สร้างใบเบิกโดยอัตโนมัติ
        if (status === 'approved') {
            const dSnap = await getDoc(detailRef);
            const d = dSnap.data();
            
            if (d) {
                // เตรียมข้อมูลพื้นฐาน (Common Data) ให้เหมือนกับการยืมอิสระ
                const baseRequisition = {
                    bookingId: bid,
                    userId: d.userId || "",
                    userName: d.userName || "-",
                    userPhone: d.userPhone || "-",
                    userType: d.userType || "-",
                    purpose: d.purpose || "-",
                    date: d.date || "-",         // ใช้ key 'date' ตามแบบอิสระ
                    time: d.timeRange || "-",    // ใช้ key 'time' ตามแบบอิสระ
                    status: 'pending',
                    createdAt: now
                };

                // [เงื่อนไขเพิ่มเติม] ถ้าเป็นนักศึกษา ให้เพิ่มข้อมูลการศึกษาเหมือนแบบอิสระ
                if (d.userType === 'นักศึกษา') {
                    baseRequisition.curriculum = d.curriculum || "-";
                    baseRequisition.batch = d.userBatch || d.batch || 0;
                }

                // --- สร้างใบเบิกวัสดุสิ้นเปลือง (Supplies) ---
                if (d.suppliesRequested && Object.keys(d.suppliesRequested).length > 0) {
                    const supReqRef = doc(db, 'artifacts', appId, 'public_data', 'supplies_system', 'requisitions', `REQ-SUP-${bid}`);
                    batch.set(supReqRef, {
                        ...baseRequisition,
                        reqId: `REQ-SUP-${bid}`,
                        type: 'booking', // ระบุประเภทตามระบบ
                        items: d.suppliesRequested,
                        roomName: d.roomName || "-" // เพิ่มเติมเพื่อให้พัสดุรู้ว่าส่งที่ห้องไหน
                    });
                }

                // --- สร้างใบขอใช้ครุภัณฑ์ (Inventory) ---
                if (d.inventoryRequested && d.inventoryRequested.length > 0) {
                    const invReqRef = doc(db, 'artifacts', appId, 'public_data', 'inventory_system', 'requisitions', `REQ-INV-${bid}`);
                    batch.set(invReqRef, {
                        ...baseRequisition,
                        reqId: `REQ-INV-${bid}`,
                        type: 'booking', // ระบุประเภทตามระบบ
                        items: d.inventoryRequested, // เป็น Array [id1, id2]
                        rid: d.roomId || null,
                        roomName: d.roomName || "-"
                    });
                }
            }
        }

        await batch.commit();
        alert("ดำเนินการอนุมัติและสร้างใบเบิกเรียบร้อยแล้ว");
        // อัปเดต UI หน้าจอ...
        if (typeof loadData === 'function') loadData(); 

    } catch (e) {
        console.error("Error approving booking:", e);
        alert("เกิดข้อผิดพลาด: " + e.message);
    }
};
    </script>
</body>
</html>
