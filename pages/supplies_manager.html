<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; padding: 20px; }
        .permission-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 99px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <!-- Auth Overlay -->
    <div id="auth-check" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-2"></div>
            <p class="text-gray-500 text-sm">กำลังยืนยันสิทธิ์เข้าใช้งาน...</p>
        </div>
    </div>

    <div id="main-content" class="max-w-5xl mx-auto hidden">
        <!-- Header & Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <h1 class="text-2xl font-bold text-gray-800">จัดการสต็อกวัสดุสิ้นเปลือง</h1>
                    <span id="role-badge" class="permission-badge bg-gray-100 text-gray-400">Checking...</span>
                </div>
                <p class="text-blue-500 text-xs font-bold uppercase tracking-widest">Supplies & Stock Control</p>
                <div id="managers-list" class="mt-2 text-[10px] text-gray-400 flex items-center gap-1">
                    <i class="fas fa-user-shield"></i> ผู้ดูแลเอกสารนี้: <span id="manager-names" class="font-semibold italic">กำลังโหลด...</span>
                </div>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
                <button id="btn-manage-access" onclick="openAccessModal()" class="hidden bg-white border border-gray-200 text-gray-600 px-4 py-2.5 rounded-xl hover:bg-gray-50 transition flex items-center font-bold text-sm">
                    <i class="fas fa-users-cog mr-2"></i> ตั้งค่าผู้ดูแล
                </button>
                <button id="btn-add-supply" onclick="openSupplyModal()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl transition flex items-center shadow-lg shadow-blue-200 font-bold">
                    <i class="fas fa-plus mr-2"></i> เพิ่มวัสดุใหม่
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="relative col-span-2">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="searchBox" onkeyup="renderSupplies()" placeholder="ค้นหาชื่อวัสดุ..." class="w-full pl-12 pr-4 py-3 bg-white rounded-xl border border-gray-100 shadow-sm outline-none focus:ring-2 focus:ring-blue-400 transition">
            </div>
            <select id="catFilter" onchange="renderSupplies()" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-100 shadow-sm outline-none font-bold text-gray-600">
                <option value="all">ทุกหมวดหมู่</option>
                <option value="medical">🩺 เวชภัณฑ์</option>
                <option value="stationery">✏️ เครื่องเขียน</option>
                <option value="cleaning">🧼 งานบ้าน/ความสะอาด</option>
                <option value="other">📦 อื่นๆ</option>
            </select>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-400">
                    <tr>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-wider">หมวดหมู่</th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-wider">ชื่อวัสดุ</th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-wider text-center">คงเหลือ</th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-wider text-center">หน่วย</th>
                        <th id="th-actions" class="hidden px-6 py-4 text-[10px] font-bold uppercase tracking-wider text-right">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="supplies-list" class="divide-y divide-gray-50 text-sm">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Access Control Modal -->
    <div id="accessModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[70]">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transition-all">
            <h2 class="text-xl font-bold text-gray-800 mb-2">ตั้งค่าผู้ดูแลเอกสาร</h2>
            <p class="text-xs text-gray-500 mb-6">ระบุอีเมลของผู้ที่ต้องการให้สิทธิ์จัดการสต็อกพัสดุในหน้านี้</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">อีเมลผู้ดูแล (คั่นด้วยเครื่องหมาย ,)</label>
                    <textarea id="documentManagers" rows="3" placeholder="email1@bcn.ac.th, email2@bcn.ac.th" 
                              class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition text-sm font-mono"></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeAccessModal()" class="flex-1 py-3 text-gray-500 font-bold hover:bg-gray-50 rounded-xl transition text-sm">ยกเลิก</button>
                <button onclick="saveAccess()" class="flex-[2] py-3 bg-blue-900 text-white font-bold rounded-xl shadow-lg hover:bg-black transition text-sm">บันทึกสิทธิ์ผู้ดูแล</button>
            </div>
        </div>
    </div>

    <!-- Supply Modal -->
    <div id="supplyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transition-all">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="modalTitle" class="text-xl font-bold text-gray-800">ข้อมูลวัสดุ</h2>
                    <p id="displayId" class="text-[10px] font-mono text-gray-400 bg-gray-50 px-2 py-1 rounded mt-1 inline-block uppercase tracking-tighter">NEW ITEM</p>
                </div>
                <button onclick="closeSupplyModal()" class="text-gray-400 hover:text-gray-600 transition"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-4">
                <input type="hidden" id="supplyId">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">ชื่อวัสดุ/อุปกรณ์</label>
                    <input type="text" id="supplyName" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition font-bold text-gray-700">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">หมวดหมู่</label>
                        <select id="supplyCat" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                            <option value="medical">เวชภัณฑ์</option>
                            <option value="stationery">เครื่องเขียน</option>
                            <option value="cleaning">ความสะอาด</option>
                            <option value="other">อื่นๆ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">หน่วยนับ</label>
                        <input type="text" id="supplyUnit" placeholder="เช่น ชิ้น, กล่อง" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">URL รูปภาพพัสดุ</label>
                        <div class="flex gap-2">
                            <input type="text" id="supplyImg" placeholder="https://..." class="flex-1 border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition text-sm">
                            <div id="img-preview-box" class="w-12 h-12 rounded-lg border-2 border-dashed border-gray-200 flex items-center justify-center overflow-hidden bg-gray-50">
                                <i class="fas fa-image text-gray-300"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-500 uppercase mb-1 ml-1">จำนวนคงเหลือปัจจุบัน</label>
                    <input type="number" id="supplyQty" value="0" class="w-full border-2 border-blue-50 p-3 rounded-xl outline-none focus:border-blue-500 transition bg-blue-50/30 text-xl font-bold text-blue-600">
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button onclick="closeSupplyModal()" class="flex-1 py-3 text-gray-500 font-bold hover:bg-gray-50 rounded-xl transition text-sm">ยกเลิก</button>
                <button id="saveBtn" onclick="saveSupply()" class="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition text-sm">
                    บันทึกข้อมูล
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCE4dMslU9LXlbqu4OFJOIDX85sjCzd6r8",
  authDomain: "bcn-connect-9df78.firebaseapp.com",
  projectId: "bcn-connect-9df78",
  storageBucket: "bcn-connect-9df78.firebasestorage.app",
  messagingSenderId: "308971815083",
  appId: "1:308971815083:web:a6abe5135422b84bf837ee",
  measurementId: "G-BW7BJNNMJG"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bcn-connect-app';

        const getSuppliesDocRef = () => doc(db, 'artifacts', appId, 'public_data', 'supplies_system', 'main', 'supplies_map');

        let suppliesData = {};
        let documentManagers = [];
        let userRole = 'viewer'; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid));
                const isSuperAdmin = userDoc.exists() && userDoc.data().role === 'admin';
                listenSupplies(user, isSuperAdmin);
            } else {
                signInAnonymously(auth);
            }
        });

        function listenSupplies(user, isSuperAdmin) {
            onSnapshot(getSuppliesDocRef(), (snap) => {
                const data = snap.exists() ? snap.data() : { items: {}, managers: [] };
                suppliesData = data.items || {};
                documentManagers = data.managers || [];

                const isManager = documentManagers.includes(user.email);
                
                if (isSuperAdmin) {
                    userRole = 'admin';
                    setBadge('Super Admin', 'bg-purple-100 text-purple-600');
                    document.getElementById('btn-manage-access').classList.remove('hidden');
                    document.getElementById('btn-add-supply').classList.remove('hidden');
                    document.getElementById('th-actions').classList.remove('hidden');
                } else if (isManager) {
                    userRole = 'manager';
                    setBadge('Document Manager', 'bg-blue-100 text-blue-600');
                    document.getElementById('btn-add-supply').classList.remove('hidden');
                    document.getElementById('th-actions').classList.remove('hidden');
                } else {
                    userRole = 'viewer';
                    setBadge('View Only', 'bg-gray-100 text-gray-400');
                    document.getElementById('btn-manage-access').classList.add('hidden');
                    document.getElementById('btn-add-supply').classList.add('hidden');
                    document.getElementById('th-actions').classList.add('hidden');
                }

                document.getElementById('manager-names').innerText = documentManagers.length > 0 ? documentManagers.join(', ') : 'ยังไม่ได้กำหนด';
                document.getElementById('auth-check').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                
                renderSupplies();
            });
        }

        function setBadge(text, className) {
            const badge = document.getElementById('role-badge');
            badge.innerText = text;
            badge.className = `permission-badge ${className}`;
        }

        const catNames = { medical: 'เวชภัณฑ์', stationery: 'เครื่องเขียน', cleaning: 'ความสะอาด', other: 'อื่นๆ' };

        window.renderSupplies = () => {
    const list = document.getElementById('supplies-list');
    const search = document.getElementById('searchBox').value.toLowerCase();
    const filter = document.getElementById('catFilter').value;
    list.innerHTML = '';
    
    const canManage = (userRole === 'admin' || userRole === 'manager');
    
    Object.keys(suppliesData).sort().forEach(id => {
        const item = suppliesData[id];
        const matchesSearch = item.n.toLowerCase().includes(search);
        const matchesFilter = filter === 'all' || item.c === filter;

        if (matchesSearch && matchesFilter) {
            // ตรวจสอบว่ามีรูปภาพหรือไม่ ถ้าไม่มีให้ใช้ไอคอนแทน
            const imageHtml = item.i 
                ? `<img src="${item.i}" class="w-10 h-10 rounded-lg object-cover shadow-sm">` 
                : `<div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center text-gray-300"><i class="fas fa-box-open"></i></div>`;

            list.insertAdjacentHTML('beforeend', `
                <tr class="hover:bg-gray-50/50 transition-all group">
                    <td class="px-6 py-4">
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded border border-gray-100 text-gray-400 uppercase">
                            ${catNames[item.c] || 'อื่นๆ'}
                        </span>
                    </td>
                    <td class="px-6 py-4 flex items-center gap-4">
                        ${imageHtml}
                        <span class="font-bold text-gray-700">${item.n}</span>
                    </td>
                    <td class="px-6 py-4 text-center font-mono font-bold ${item.q <= 5 ? 'text-red-500' : 'text-blue-600'}">
                        ${item.q}
                    </td>
                    <td class="px-6 py-4 text-center text-gray-400 text-xs">${item.u}</td>
                    ${canManage ? `
                    <td class="px-6 py-4 text-right space-x-2 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="editSupply('${id}')" class="text-blue-400 hover:text-blue-600 transition"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteSupply('${id}')" class="text-red-200 hover:text-red-500 transition"><i class="fas fa-trash"></i></button>
                    </td>` : '<td class="hidden"></td>'}
                </tr>
            `);
        }
    });
};

        window.openAccessModal = () => {
            document.getElementById('documentManagers').value = documentManagers.join(', ');
            document.getElementById('accessModal').classList.remove('hidden');
        };

        window.closeAccessModal = () => document.getElementById('accessModal').classList.add('hidden');

        window.saveAccess = async () => {
            if (userRole !== 'admin') return;
            const emails = document.getElementById('documentManagers').value.split(',').map(e => e.trim()).filter(e => e !== "");
            try {
                await updateDoc(getSuppliesDocRef(), { managers: emails });
                closeAccessModal();
            } catch (e) { alert(e.message); }
        };

        window.saveSupply = async () => {
            if (userRole === 'viewer') return;
            let id = document.getElementById('supplyId').value;
            const n = document.getElementById('supplyName').value.trim();
            const c = document.getElementById('supplyCat').value;
            const img = document.getElementById('supplyImg').value.trim();
            const u = document.getElementById('supplyUnit').value.trim();
            const q = parseInt(document.getElementById('supplyQty').value) || 0;

            if (!n || !u) return alert("กรุณาระบุชื่อและหน่วยนับ");
            if (!id) id = 'SUP-' + Math.random().toString(36).substr(2, 6).toUpperCase();

            try {
                const docRef = getSuppliesDocRef();
                const updateData = {};
                updateData[`items.${id}`] = { n, c, u, q, i: img, at: new Date().toISOString() };
                
                await updateDoc(docRef, updateData).catch(async (e) => {
                    if (e.code === 'not-found') {
                        await setDoc(docRef, { items: { [id]: { n, c, u, q } }, managers: [] });
                    } else throw e;
                });
                closeSupplyModal();
            } catch (err) { alert(err.message); }
        };

        window.openSupplyModal = () => {
            document.getElementById('supplyId').value = "";
            document.getElementById('displayId').innerText = "NEW ITEM";
            document.getElementById('supplyName').value = "";
            document.getElementById('supplyQty').value = 0;
            document.getElementById('supplyImg').value = "";
            document.getElementById('img-preview-box').innerHTML = '<i class="fas fa-image text-gray-300"></i>';
            document.getElementById('supplyUnit').value = "";
            document.getElementById('modalTitle').innerText = "เพิ่มวัสดุใหม่";
            document.getElementById('supplyModal').classList.remove('hidden');
        };

        window.editSupply = (id) => {
            const item = suppliesData[id];
            document.getElementById('supplyId').value = id;
            document.getElementById('displayId').innerText = id;
            document.getElementById('supplyName').value = item.n;
            document.getElementById('supplyCat').value = item.c;
            document.getElementById('supplyImg').value = item.i || "";
            if(item.i) {
                document.getElementById('img-preview-box').innerHTML = `<img src="${item.i}" class="w-full h-full object-cover">`;
            }
            document.getElementById('supplyUnit').value = item.u;
            document.getElementById('supplyQty').value = item.q;
            document.getElementById('modalTitle').innerText = "แก้ไขข้อมูล";
            document.getElementById('supplyModal').classList.remove('hidden');
        };

        window.closeSupplyModal = () => document.getElementById('supplyModal').classList.add('hidden');

        window.deleteSupply = async (id) => {
            if (userRole === 'viewer') return;
            if (!confirm(`ยืนยันการลบรายการ ${id}?`)) return;
            const updateData = {};
            updateData[`items.${id}`] = deleteField();
            await updateDoc(getSuppliesDocRef(), updateData);
        };

        document.getElementById('supplyImg').addEventListener('input', (e) => {
    const imgBox = document.getElementById('img-preview-box');
    const url = e.target.value;
    if (url) {
        imgBox.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
    } else {
        imgBox.innerHTML = '<i class="fas fa-image text-gray-300"></i>';
    }
});
    </script>
</body>
</html>
