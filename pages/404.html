<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ไม่พบหน้าที่คุณต้องการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* ตกแต่งพื้นหลังเบาๆ ให้ดูมีมิติ */
        .bg-gradient-soft {
            background: radial-gradient(circle at center, #f8fafc 0%, #f1f5f9 100%);
        }
    </style>
</head>
<body class="bg-gradient-soft flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full text-center">
        <!-- Error Visual Area -->
        <div class="flex flex-col items-center mb-10">
            <!-- Icon with Floating Animation -->
            <div class="floating mb-6">
                <div class="bg-white p-7 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.08)] border border-slate-50 relative">
                    <i class="fas fa-map-signs text-6xl text-blue-500"></i>
                    <!-- Small Indicator Dot -->
                    <div class="absolute -top-1 -right-1 w-6 h-6 bg-red-500 rounded-full border-4 border-white"></div>
                </div>
            </div>
            
            <!-- Large 404 Text - ปรับให้จางลงและไม่ทับไอคอน -->
            <h1 class="text-8xl font-black text-slate-200/60 tracking-tighter select-none">404</h1>
        </div>

        <div class="space-y-3 mb-10">
            <h2 class="text-2xl font-bold text-slate-800">ไม่พบหน้าที่คุณต้องการ</h2>
            <p class="text-slate-500 leading-relaxed px-4">
                หน้าที่คุณกำลังมองหาอาจถูกลบไปแล้ว <br>
                หรือลิงก์ที่คุณใช้เข้าถึงอาจจะไม่ถูกต้อง
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-4">
            <button onclick="parent.navigateTo('pages/home.html', parent.document.querySelector('[onclick*=\'pages/home.html\']'))" 
                    class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
                <i class="fas fa-home mr-2"></i> กลับสู่หน้าหลัก
            </button>
        </div>

        <!-- System Reference -->
        <div class="mt-16 pt-8 border-t border-slate-200/60">
            <div class="inline-flex items-center px-3 py-1 bg-slate-100 rounded-full">
                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Error Reference: PAGE_NOT_FOUND</span>
            </div>
        </div>
    </div>
</body>
</html>
